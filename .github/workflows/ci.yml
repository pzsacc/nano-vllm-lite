name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check nano_vllm tests benchmarks --select E9,F63,F7,F82
      - run: ruff format --check nano_vllm tests benchmarks || true

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU, no CUDA build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-build-isolation || pip install -e . --no-deps
          pip install pytest transformers xxhash safetensors
      - name: Run CPU tests
        run: pytest tests/ -m "not gpu" -q
        env:
          NANO_VLLM_TEST_MODEL: /dev/null
