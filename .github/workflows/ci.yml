name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.0
      - run: ruff check nano_vllm tests benchmarks
      - run: ruff format --check nano_vllm tests benchmarks

  test-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU, no CUDA build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors xxhash numpy tqdm pytest
          pip install -e . --no-build-isolation --no-deps
      - name: Run CPU tests
        run: pytest tests/ -m "not gpu" -q
        env:
          NANO_VLLM_TEST_MODEL: /dev/null
